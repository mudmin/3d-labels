name: Deploy to GitHub Pages

# Manual only while the project is private: a Pages site is public even when the repo isn't.
# Add `push: branches: [main]` back here to deploy on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only what the browser needs.
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html css js vendor fonts _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
